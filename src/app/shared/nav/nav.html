<!-- Professional top header (public navigation only) -->
<header class="site-header">
  <div class="header-container">
    <!-- Brand / logo -->
    <a
      class="brand"
      routerLink="/"
      (click)="closeMenu()"
      [attr.aria-label]="brand.name + ' — Home'">
      <img class="brand-avatar" [src]="profilePhoto()" [alt]="profileName().fullName + ' profile photo'" />
      <span class="brand-text">
        <span class="brand-name">{{ brand.name }}</span>
        <span class="brand-role">{{ brand.tagline }}</span>
      </span>
    </a>

    <!-- Hamburger (mobile only) -->
    <button
      type="button"
      class="menu-toggle"
      (click)="toggleMenu()"
      [class.open]="isMenuOpen"
      [attr.aria-expanded]="isMenuOpen"
      aria-controls="primary-navigation"
      aria-label="Toggle navigation menu">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>

    <!-- Public links (rendered dynamically) -->
    <nav
      class="primary-nav"
      [class.open]="isMenuOpen"
      id="primary-navigation"
      aria-label="Primary navigation">
      <ul class="nav-list">
        @for (link of links; track link.path) {
          <li>
            <a
              class="nav-link"
              [routerLink]="link.path"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: !!link.exact }"
              (click)="closeMenu()">
              {{ link.label }}
            </a>
          </li>
        }
      </ul>

      <!-- Socials — shown inside the mobile menu only (the footer has them too) -->
      <div class="nav-socials">
        @for (social of socialLinks; track social.url) {
          <a
            [href]="social.url"
            [target]="isExternal(social.url) ? '_blank' : null"
            [rel]="isExternal(social.url) ? 'noopener noreferrer' : null">
            {{ social.label }}
          </a>
        }
      </div>
    </nav>
  </div>

  <!-- Backdrop shown behind the mobile menu -->
  @if (isMenuOpen) {
    <div class="backdrop" (click)="closeMenu()" aria-hidden="true"></div>
  }
</header>
